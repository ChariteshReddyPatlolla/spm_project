version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: research-assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: research-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - CHROMA_PERSIST_DIRECTORY=/app/storage/chroma
      - SQLITE_DB_URL=sqlite:////app/storage/data/research_assistant.db
      - UPLOAD_DIR=/app/storage/uploads
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/chroma:/app/storage/chroma
      - ./storage/data:/app/storage/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-assistant-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:

