<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="dfdPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dfdEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="dfdAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="dfdPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="dfdArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="dfdArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="dfdArrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1300" height="90" fill="#0f172a" opacity="0.8"/>
  <text x="40" y="45" fill="#f8fafc" font-size="24" font-weight="800">Multi-Paper Research Assistant — Data Flow Diagram (DFD)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="14" font-weight="500">Level 0 (Context Diagram) and Level 1 (Detailed Subsystem Data Transformations)</text>
  <rect x="1100" y="30" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1125" y="51" fill="#60a5fa" font-size="12" font-weight="700">DFD LEVEL 0 &amp; 1</text>

  <!-- ==================== SECTION A: LEVEL 0 CONTEXT DIAGRAM ==================== -->
  <g transform="translate(40, 115)">
    <rect width="1220" height="180" rx="14" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5" filter="url(#glowShadow)"/>
    <text x="25" y="30" fill="#60a5fa" font-size="13" font-weight="800" letter-spacing="0.5">SECTION A: LEVEL 0 CONTEXT DIAGRAM</text>

    <!-- Entity: User / Researcher -->
    <g transform="translate(50, 60)">
      <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="90" cy="35" r="16" fill="#3b82f6" opacity="0.3"/>
      <text x="90" y="40" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">Researcher / User</text>
      <text x="90" y="65" fill="#94a3b8" font-size="11" text-anchor="middle">(Academic &amp; Engineer)</text>
    </g>

    <!-- Process: Core System 0.0 -->
    <g transform="translate(510, 50)">
      <rect width="250" height="110" rx="20" fill="url(#dfdPrimary)" stroke="#60a5fa" stroke-width="2"/>
      <text x="125" y="38" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">0.0</text>
      <text x="125" y="60" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Multi-Paper Research</text>
      <text x="125" y="80" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Assistant System</text>
      <text x="125" y="98" fill="#dbeafe" font-size="10" text-anchor="middle">(LangGraph Agentic RAG Core)</text>
    </g>

    <!-- Data Stores: ChromaDB + SQLite -->
    <g transform="translate(980, 60)">
      <rect width="190" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="95" y="35" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">Storage Stores (D1-D3)</text>
      <text x="95" y="55" fill="#94a3b8" font-size="10" text-anchor="middle">D1: SQLite Database</text>
      <text x="95" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">D2: ChromaDB Vectors</text>
      <text x="95" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">D3: Uploaded PDFs</text>
    </g>

    <!-- Arrows for Level 0 -->
    <path d="M 230 85 L 510 85" stroke="#60a5fa" stroke-width="2" marker-end="url(#dfdArrow)"/>
    <text x="310" y="78" fill="#cbd5e1" font-size="10" font-weight="600">1. Upload PDFs &amp; Queries</text>

    <path d="M 510 125 L 230 125" stroke="#34d399" stroke-width="2" marker-end="url(#dfdArrowEmerald)"/>
    <text x="260" y="142" fill="#cbd5e1" font-size="10" font-weight="600">2. Cited Answers, Summaries &amp; Matrix</text>

    <path d="M 760 90 L 980 90" stroke="#f59e0b" stroke-width="2" marker-end="url(#dfdArrowAmber)"/>
    <text x="810" y="82" fill="#cbd5e1" font-size="10" font-weight="600">Store Indices &amp; Sessions</text>

    <path d="M 980 120 L 760 120" stroke="#60a5fa" stroke-width="2" marker-end="url(#dfdArrow)"/>
    <text x="810" y="138" fill="#cbd5e1" font-size="10" font-weight="600">Retrieve Chunks &amp; History</text>
  </g>

  <!-- ==================== SECTION B: LEVEL 1 DETAILED DATA FLOW ==================== -->
  <g transform="translate(40, 320)">
    <rect width="1220" height="645" rx="14" fill="#0f172a" stroke="#0e7490" stroke-width="1.5" filter="url(#glowShadow)"/>
    <text x="25" y="30" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="0.5">SECTION B: LEVEL 1 DETAILED COMPONENT DATA FLOW</text>

    <!-- Process 1.0: Ingestion -->
    <g transform="translate(30, 60)">
      <rect width="210" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">1.0 PDF Parser &amp; OCR</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="10">• PyMuPDF layout sorting</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="10">• Running header/footer scrub</text>
      <text x="15" y="72" fill="#cbd5e1" font-size="10">• Tesseract scanned fallback</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">Output: Clean Structured Text</text>
    </g>

    <!-- Arrow 1.0 -> 2.0 -->
    <path d="M 240 105 L 280 105" stroke="#38bdf8" stroke-width="2" marker-end="url(#dfdArrow)"/>

    <!-- Process 2.0: Structure-Aware Chunking -->
    <g transform="translate(280, 60)">
      <rect width="210" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">2.0 Structure Chunking</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="10">• Section &amp; paragraph splits</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="10">• Size: 500, Overlap: 100</text>
      <text x="15" y="72" fill="#cbd5e1" font-size="10">• Metadata: doc_id, page_num</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">Output: Enriched Chunk Units</text>
    </g>

    <!-- Arrow 2.0 -> 3.0 -->
    <path d="M 490 105 L 530 105" stroke="#38bdf8" stroke-width="2" marker-end="url(#dfdArrow)"/>

    <!-- Process 3.0: Dual Embedding & Indexing -->
    <g transform="translate(530, 60)">
      <rect width="220" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">3.0 Dual Vectorization</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="10">• SentenceTransformers (384-d)</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="10">• BM25+ tokenized corpus</text>
      <text x="15" y="72" fill="#cbd5e1" font-size="10">• Batch indexing &amp; LRU cache</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">Output: Dense &amp; Lexical Indices</text>
    </g>

    <!-- Data Stores D1, D2, D3 -->
    <g transform="translate(800, 60)">
      <rect width="390" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="24" fill="#34d399" font-size="12" font-weight="700">D1-D3: Persistent Storage Engines</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="10">• D1: ChromaDB (storage/chroma/chroma.sqlite3)</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="10">• D2: SQLite relational DB (storage/data/research_assistant.db)</text>
      <text x="15" y="72" fill="#cbd5e1" font-size="10">• D3: Ingested PDF Archive (storage/uploads/)</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">State: Document catalog, vector collections &amp; chat histories</text>
    </g>

    <!-- Arrow 3.0 -> Data Stores -->
    <path d="M 750 105 L 800 105" stroke="#10b981" stroke-width="2" marker-end="url(#dfdArrowEmerald)"/>

    <!-- Horizontal Divider -->
    <line x1="30" y1="180" x2="1190" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="6,6"/>
    <text x="35" y="202" fill="#94a3b8" font-size="11" font-weight="600">ONLINE QUERY EXECUTION PIPELINE (LANGGRAPH AGENT)</text>

    <!-- Process 4.0: Query Understanding -->
    <g transform="translate(30, 220)">
      <rect width="210" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="15" y="24" fill="#fbbf24" font-size="12" font-weight="700">4.0 Intent &amp; Scope</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="10">• Deictic follow-up resolution</text>
      <text x="15" y="56" fill="#cbd5e1" font-size="10">• Intent classification</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="10">• Filter active document IDs</text>
      <text x="15" y="86" fill="#f59e0b" font-size="10" font-weight="600">Conditional Edge Router</text>
    </g>

    <!-- Fast-path bypass for chit-chat / summaries -->
    <path d="M 135 325 L 135 375 L 30 375 L 30 460 L 60 460" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#dfdArrowAmber)"/>
    <text x="40" y="395" fill="#f59e0b" font-size="9">summary/chit-chat bypass</text>

    <!-- Process 5.0: Research Planning & Subtasks -->
    <g transform="translate(280, 220)">
      <rect width="210" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="15" y="24" fill="#fbbf24" font-size="12" font-weight="700">5.0 Research Planner</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="10">• Query decomposition</text>
      <text x="15" y="56" fill="#cbd5e1" font-size="10">• Subtask generation</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="10">• 4-point investigation plan</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">Output: Target search sub-queries</text>
    </g>

    <!-- Arrow 4.0 -> 5.0 -->
    <path d="M 240 272 L 280 272" stroke="#f59e0b" stroke-width="2" marker-end="url(#dfdArrowAmber)"/>

    <!-- Process 6.0: Hybrid Retrieval & RRF Fusion -->
    <g transform="translate(530, 220)">
      <rect width="220" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="15" y="24" fill="#fbbf24" font-size="12" font-weight="700">6.0 Hybrid Retrieval</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="10">• ChromaDB semantic search</text>
      <text x="15" y="56" fill="#cbd5e1" font-size="10">• BM25+ exact keyword search</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="10">• Reciprocal Rank Fusion (k=60)</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">Output: Top-20 fused candidates</text>
    </g>

    <!-- Arrow 5.0 -> 6.0 -->
    <path d="M 490 272 L 530 272" stroke="#f59e0b" stroke-width="2" marker-end="url(#dfdArrowAmber)"/>

    <!-- Arrow from D1/D2 to 6.0 (Retrieval) -->
    <path d="M 850 150 L 850 240 L 750 240" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#dfdArrowEmerald)"/>
    <text x="770" y="200" fill="#34d399" font-size="9">Fetch Chunks &amp; Vectors</text>

    <!-- Process 7.0: Cross-Encoder Reranker -->
    <g transform="translate(800, 220)">
      <rect width="200" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="15" y="24" fill="#fbbf24" font-size="12" font-weight="700">7.0 Cross-Encoder</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="10">• ms-marco-MiniLM-L-6-v2</text>
      <text x="15" y="56" fill="#cbd5e1" font-size="10">• Sigmoid score normalization</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="10">• Elimination of false positives</text>
      <text x="15" y="86" fill="#94a3b8" font-size="9">Output: Top-8 reranked evidence</text>
    </g>

    <!-- Arrow 6.0 -> 7.0 -->
    <path d="M 750 272 L 800 272" stroke="#f59e0b" stroke-width="2" marker-end="url(#dfdArrowAmber)"/>

    <!-- Process 8.0: Evidence Extraction -->
    <g transform="translate(1030, 220)">
      <rect width="160" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="24" fill="#fbbf24" font-size="12" font-weight="700">8.0 Evidence</text>
      <text x="12" y="42" fill="#cbd5e1" font-size="10">• Fact units</text>
      <text x="12" y="56" fill="#cbd5e1" font-size="10">• Exact page link</text>
      <text x="12" y="70" fill="#cbd5e1" font-size="10">• Document IDs</text>
      <text x="12" y="86" fill="#94a3b8" font-size="9">Context assembly</text>
    </g>

    <!-- Arrow 7.0 -> 8.0 -->
    <path d="M 1000 272 L 1030 272" stroke="#f59e0b" stroke-width="2" marker-end="url(#dfdArrowAmber)"/>

    <!-- Process 9.0: Multi-Paper Analysis & Precision Synthesis -->
    <g transform="translate(530, 390)">
      <rect width="250" height="110" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="15" y="24" fill="#c084fc" font-size="12" font-weight="700">9.0 Synthesis &amp; Noise Filter</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="10">• Strips author lines &amp; table noise</text>
      <text x="15" y="56" fill="#cbd5e1" font-size="10">• Targeted intent resolvers (acronym,</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="10">  formula, BLEU, model parameters)</text>
      <text x="15" y="84" fill="#cbd5e1" font-size="10">• Cross-paper trade-off synthesis</text>
      <text x="15" y="98" fill="#94a3b8" font-size="9">Output: Draft Attributed Response</text>
    </g>

    <!-- Arrow 8.0 down to 9.0 -->
    <path d="M 1110 325 L 1110 445 L 780 445" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#dfdArrowAmber)"/>

    <!-- Process 10.0: Citation Validation Layer -->
    <g transform="translate(830, 390)">
      <rect width="360" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="800">10.0 Citation Validation Layer</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="10">• Regex parsing: [Paper Title, Page X]</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="10">• Ground-truth chunk matching: verifies text &amp; page presence</text>
      <text x="15" y="72" fill="#cbd5e1" font-size="10">• Negative message guard: prevents false fallback citations</text>
      <text x="15" y="86" fill="#cbd5e1" font-size="10">• Strips or flags any unverified/fabricated references</text>
      <text x="15" y="100" fill="#34d399" font-size="9" font-weight="600">Zero-Hallucination Delivery Gate</text>
    </g>

    <!-- Arrow 9.0 -> 10.0 -->
    <path d="M 780 445 L 830 445" stroke="#8b5cf6" stroke-width="2" marker-end="url(#dfdArrow)"/>

    <!-- Process 11.0: Final UI Delivery & Memory Commit -->
    <g transform="translate(530, 535)">
      <rect width="660" height="85" rx="10" fill="url(#dfdEmerald)" stroke="#059669" stroke-width="1.5"/>
      <text x="20" y="24" fill="#ffffff" font-size="13" font-weight="800">11.0 Client Delivery &amp; Session Persistence</text>
      <text x="20" y="44" fill="#d1fae5" font-size="11">• JSON Response with markdown content, validated citations &amp; execution step traces</text>
      <text x="20" y="60" fill="#d1fae5" font-size="11">• Updates SQLite rolling research summary &amp; conversational message history</text>
      <text x="20" y="76" fill="#ffffff" font-size="10" font-weight="700">Renders clickable [Paper, Page X] badges and Citation Drawer on React Frontend</text>
    </g>

    <!-- Arrow 10.0 -> 11.0 -->
    <path d="M 1010 500 L 1010 535" stroke="#10b981" stroke-width="2" marker-end="url(#dfdArrowEmerald)"/>

    <!-- Bypass link from Fast Handlers to 11.0 -->
    <g transform="translate(60, 435)">
      <rect width="210" height="60" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-size="11" font-weight="700">Specialized Handlers</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">Summarization / Conversational</text>
      <text x="12" y="50" fill="#94a3b8" font-size="10">Cached 11-dimension summaries</text>
    </g>
    <path d="M 270 465 L 530 560" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#dfdArrowEmerald)"/>

  </g>
</svg>
